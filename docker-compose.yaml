services:
  web:
    image: "formulize/php-dev:${FORMULIZE_PHP_VERSION:-latest}"
    build:
      context: ./docker/php
      args:
        PHP_BASE_IMAGE: "php:${FORMULIZE_PHP_VERSION:-8.3}-apache"
    restart: "unless-stopped"
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - .:/var/www/html/
      - ./trust:/var/www/trust
      - ./docker/php/conf.d/formulize.ini:/usr/local/etc/php/conf.d/formulize.ini
    ports:
      - '${FORMULIZE_BIND_HOST:-127.0.0.1}:${FORMULIZE_WEB_PORT:-8080}:80'
    links:
      - mariadb
  mariadb:
    image: "mariadb:lts"
    restart: 'no'
    healthcheck:
      test: mariadb -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e 'select 1' $$MYSQL_DATABASE
      interval: 1m
      timeout: 1s
      retries: 3
      start_period: 20s
      start_interval: 5s
    ports:
      - '${FORMULIZE_BIND_HOST:-127.0.0.1}:${FORMULIZE_DB_PORT:-3306}:3306'
    volumes:
      - ./docker/mariadb/seed:/docker-entrypoint-initdb.d
      - ./docker/mariadb/conf.d:/etc/mysql/conf.d
      - mariadb_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "abc123"
      MYSQL_DATABASE: "formulize"
      MYSQL_USER: "user"
      MYSQL_PASSWORD: "password"

volumes:
  mariadb_data:
