; Settings for measuring which lines of PHP the tests run. docker-compose.coverage.yaml puts this in the web container,
; after formulize.ini, so these replace the Xdebug settings there. See prepend.php.
;
; Coverage mode replaces debug mode, since nothing in CI connects to a debugger. Develop mode stays, as it is when
; the tests run without coverage.
xdebug.mode=develop,coverage
xdebug.start_with_request=default
auto_prepend_file=/var/www/html/tests/coverage/prepend.php
