# The main menu (docs/_includes/nav.html reads this). Six top-level items,
# each label/url pair a link in its own right, and every one also carries
# "children" - a shortcut list shown as a dropdown on hover/focus, so no item
# behaves differently from the others.
#
# Most child URLs point at a real page (checked against its front matter
# permalink). Features and Examples are each a single scrolling page rather
# than several separate ones, so their children are in-page anchors instead -
# the ids they target were added to features.html and examples.html
# specifically so this menu would have something real to point at.

- label: Features
  url: /features/
  children:
    - label: All Features
      url: /features/
    - label: Forms and data
      url: /features/#forms-and-data
    - label: Searching and reporting
      url: /features/#searching-and-reporting
    - label: Users and workflow
      url: /features/#users-and-workflow
    - label: AI
      url: /features/#ai
    - label: Extending it
      url: /features/#extending-it
    - label: Connecting it to other systems
      url: /features/#connecting-it-to-other-systems
    - label: Running it
      url: /features/#running-it
    - label: About Formulize
      url: /about

