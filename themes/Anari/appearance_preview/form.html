<!--
  Sample screen for the Appearance page's editor: an entry's form, as Anari
  draws a form screen (captured from a real one, with sample content). Anari is
  edited in simple mode only, so the logo is the one part marked with
  data-fz-part. See themes/Lyris/appearance_preview/form.html for how the
  samples work.
-->
<div class="site-layout">
  <div class="site-layout__main">
    {{header}}
    <div class="main-content">
      <div class="container">
        <div id="formulizeform"><form id="formulize_mainform" class="formulizeThemeForm" onsubmit="return false;">
          <div id="pageNavTable" class="pill-tabs">
            <a href="#" class="icon-arrow-backward pill-tabs__item navtab"> Save and Close</a>
            <a href="#" class="pill-tabs__item navtab pill-tabs__item--active">Artifact</a>
            <a href="#" class="pill-tabs__item navtab">Dimensions</a>
            <a href="#" class="pill-tabs__item navtab">Donation</a>
          </div>
          <div class="card">
            <div class="card__body">
              <div class="form-container">
                <div class="form-row" style="width: auto;">
                  <label for="pva_name" class="form-label">Short name&nbsp;<span style="color: red;">*</span></label>
                  <input type="text" id="pva_name" size="30" value="Roman Coin">
                  <p class="form-help-text">The name the artifact goes by in lists, on labels and in exhibit guides.</p>
                </div>
                <div class="form-row" style="width: auto;">
                  <label for="pva_donor" class="form-label">Donor&nbsp;</label>
                  <select id="pva_donor" size="1"><option selected>François-Marie Arouet</option><option>Emilie Du Châtelet</option><option>Freeform Solutions</option></select>
                </div>
                <div class="form-row" style="width: auto;">
                  <label for="pva_year" class="form-label">Year&nbsp;</label>
                  <input type="number" id="pva_year" class="numbers-only-textbox" value="150">
                </div>
                <div class="form-row" style="width: auto;">
                  <label class="form-label">Was the artifact donated to the museum?&nbsp;</label>
                  <input type="radio" id="pva_t1" name="pva_t" checked><label for="pva_t1">Yes</label>
                  <br><input type="radio" id="pva_t2" name="pva_t"><label for="pva_t2">No</label>
                </div>
                <div class="form-row" style="width: auto;">
                  <label for="pva_notes" class="form-label">Full description&nbsp;</label>
                  <textarea id="pva_notes" rows="4" cols="50">A very lovely Roman Coin.</textarea>
                  <p class="form-help-text">For use in brochures, on websites, etc</p>
                </div>
              </div>
            </div>
          </div>
          <div id="multipage-controls">
            <input type="button" name="save" class="formulize-form-submit-button" value="Save">
            <input type="button" name="close" class="formulize-form-submit-button" value="Close">
          </div>
        </form></div>
      </div>
    </div>
  </div>
</div>
