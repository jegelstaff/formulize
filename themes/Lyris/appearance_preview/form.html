<!--
  Sample screen for the Appearance page's advanced editor: a multi-page
  form, with Lyris's real form markup (as its form and multiPage screen
  templates and Formulize's element templates render it). Each part the editor
  can select carries data-fz-part, naming one of the parts ("components") in
  modules/formulize/include/appearance_tokens.json. Placeholders in double
  braces are filled in by modules/formulize/appearance_preview.php.
-->
<div class="lyris-app lyris-app--sidebar-closed" id="lyris-app">
  {{header}}
  <div class="lyris-app__body">
    <main class="lyris-main" role="main" id="lyris-main" data-fz-part="page">
      <div class="lyris-page fz-content">
      <div id="formulizeform"><form id="formulize_mainform" class="formulizeThemeForm" action="#" method="post" onsubmit="return false;">
        <div id="pageNavTable" class="pill-tabs">
          <a href="#" class="icon-arrow-backward pill-tabs__item navtab" data-fz-part="tabs"> Save and Close</a>
          <a href="#" class="pill-tabs__item navtab pill-tabs__item--active" data-fz-part="tabs">Artifact</a>
          <a href="#" class="pill-tabs__item navtab" data-fz-part="tabs">Dimensions</a>
          <a href="#" class="pill-tabs__item navtab" data-fz-part="tabs">Donation</a>
          <a href="#" class="pill-tabs__item navtab" data-fz-part="tabs">Collections</a>
        </div>
        <div class="fz-card lyris-form-card lyris-form-screen" data-fz-part="form">
          <div class="fz-card__header lyris-form-card__header">
            <h3 class="fz-card__title" data-fz-part="title">Artifact</h3>
          </div>
          <div class="lyris-form-card__body">
            <div class="lyris-form lyris-form--label-top form-container">

              <div class="fz-field form-row">
                <div style="width: 20%;" class="col1">
                  <label for="pv_name" class="fz-field__label form-label" data-fz-part="label">Short name <span class="fz-field__req">*</span></label>
                </div>
                <div style="width: auto;" class="fz-field__body col2">
                  <input type="text" id="pv_name" value="Roman Coin" data-fz-part="field">
                  <p class="fz-field__help form-help-text" data-fz-part="help">The name the artifact goes by in lists, on labels and in exhibit guides. Keep it short: the full description, for brochures and websites, has room for everything else.</p>
                </div>
              </div>

              <div class="fz-field form-row">
                <div style="width: 20%;" class="col1">
                  <label for="pv_donor" class="fz-field__label form-label" data-fz-part="label">Donor</label>
                </div>
                <div style="width: auto;" class="fz-field__body col2">
                  <select id="pv_donor" data-fz-part="field"><option selected>François-Marie Arouet</option><option>Emilie Du Châtelet</option><option>Freeform Solutions</option></select>
                </div>
              </div>

              <div class="fz-field form-row">
                <div style="width: 20%;" class="col1">
                  <label for="pv_year" class="fz-field__label form-label" data-fz-part="label">Year</label>
                </div>
                <div style="width: auto;" class="fz-field__body col2">
                  <input type="text" id="pv_year" value="150" data-fz-part="field">
                </div>
              </div>

              <div class="fz-field form-row">
                <div style="width: 20%;" class="col1">
                  <label class="fz-field__label form-label" data-fz-part="label">ID Number</label>
                </div>
                <div style="width: auto;" class="fz-field__body col2" data-fz-part="value">
                  1
                </div>
              </div>

              <div class="fz-field form-row">
                <div style="width: 20%;" class="col1">
                  <label class="fz-field__label form-label" data-fz-part="label">Was the artifact donated to the museum?</label>
                </div>
                <div style="width: auto;" class="fz-field__body col2" data-fz-part="options">
                  <input type="radio" id="pv_t1" name="pv_t" checked><label for="pv_t1">Yes</label>
                  <br><input type="radio" id="pv_t2" name="pv_t"><label for="pv_t2">No</label>
                </div>
              </div>

              <div class="fz-field form-row">
                <div style="width: 20%;" class="col1">
                  <label for="pv_notes" class="fz-field__label form-label" data-fz-part="label">Full description</label>
                </div>
                <div style="width: auto;" class="fz-field__body col2">
                  <textarea id="pv_notes" rows="5" cols="35" data-fz-part="field">A very lovely Roman Coin.</textarea>
                  <p class="fz-field__help form-help-text" data-fz-part="help">For use in brochures, on websites, etc</p>
                </div>
              </div>

            </div>
          </div>
        </div>
        <div id="multipage-controls" data-fz-part="toolbar">
          <input type="button" class="formulize-form-submit-button" name="prev" value="Save and Close" data-fz-part="button">
          <input type="button" class="formulize-form-submit-button" name="save" value="Save" data-fz-part="button">
          <input type="button" class="formulize-form-submit-button" name="close" value="Close" data-fz-part="button">
          <input type="button" class="formulize-form-submit-button" name="next" value="Save and Continue" data-fz-part="button">
        </div>
      </form></div>
      </div>
    </main>
  </div>
</div>
