name: Manual E2E Test Suite

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test against'
        required: true
        default: 'master'
        type: string
      skip_docker_build:
        description: 'Skip Docker rebuild (use existing containers)'
        required: false
        default: false
        type: boolean
      test_filter:
        description: 'Run specific tests (optional - use Playwright test filters)'
        required: false
        default: ''
        type: string
      coverage:
        description: 'Measure which lines of PHP the tests run (slower)'
        required: false
        default: false
        type: boolean
      coverage_base:
        description: 'With coverage, the branch to compare with. The report lists the lines this branch changed that no test ran'
        required: false
        default: 'master'
        type: string
  workflow_call:
    inputs:
      ref:
        description: 'What to checkout'
        required: true
        type: string
      skip_docker_build:
        description: 'Skip Docker rebuild (use existing containers)'
        required: false
        default: false
        type: boolean
      test_filter:
        description: 'Run specific tests (optional - use Playwright test filters)'
        required: false
        default: ''
        type: string
      coverage:
        description: 'Measure which lines of PHP the tests run (slower)'
        required: false
        default: false
        type: boolean
      coverage_base:
        description: 'With coverage, the branch to compare with. The report lists the lines this branch changed that no test ran'
        required: false
        default: 'master'
        type: string

env:
  GITHUB_TOKEN: ${{ github.token }}
  # Where the coverage data goes, when the run measures coverage. Outside the checkout, which the web server serves. See tests/coverage/prepend.php
  FORMULIZE_COVERAGE_DIR: /tmp/formulize-coverage

jobs:
  manual-e2e-test-run:
    runs-on: ubuntu-26.04 # Not ubuntu-latest: Playwright only installs browser deps on the OS releases it knows, so move this up together with Playwright

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.branch || inputs.ref }}

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: tests/e2e/package-lock.json

    # What the web server writes belongs to it, as it would on a real site, and keeps the checkout's 755/644 - no
    # 777. www-data is uid and gid 33, in the php:apache image and on the Ubuntu runner.
    # themes/Lyris: the appearance specs (formulize-core/04-appearance) save looks, which the web server writes
    # to themes/Lyris/appearance, a folder it makes the first time.
    # templates/screens, all the way down: the web server makes a folder for a screen inside its theme's folder
    # when its templates are customized, and rewrites the screens' template files.
    # formulize_dateformats.php: saving the date and time formats in Settings writes them to this file. A write that fails
    # says nothing, so without this the setting would save and the dates wouldn't change.
    # The webroot is the one folder both sides write to - the web server's install.lock, and the .htaccess
    # Playwright's global setup writes (tests/e2e/htaccess-setup.js) - so it stays the runner's, and the web
    # server gets in through its group.
    - name: Set file/directory permissions
      run: |
        sudo chown 33:33 trust uploads modules templates_c cache tokens logs modules/formulize/cache modules/formulize/code modules/formulize/export modules/formulize/language/english/mail_template modules/formulize/language/english/formulize_dateformats.php modules/formulize/queue modules/formulize/temp modules/formulize/upload mainfile.php
        sudo chown -R 33:33 themes
        sudo chown -R 33:33 modules/formulize/templates/screens
        sudo chgrp 33 ~/work/formulize/formulize
        chmod 775 ~/work/formulize/formulize

    # Both the web server and the command line write the coverage data, as different users, and the phase file says which
    # set of tests is running. Each set's step writes its name there as it starts.
    - name: Prepare for coverage
      if: ${{ inputs.coverage }}
      run: |
        # PHP runs this file before every request, so without it every page would fail
        if [ ! -f tests/coverage/prepend.php ]; then
          echo "::error::The branch being tested has no tests/coverage/prepend.php, so it can't be run with coverage"
          exit 1
        fi
        mkdir -p "$FORMULIZE_COVERAGE_DIR/data" "$FORMULIZE_COVERAGE_DIR/executable"
        chmod -R 777 "$FORMULIZE_COVERAGE_DIR"
        echo php-logic > "$FORMULIZE_COVERAGE_DIR/phase"

    - name: Stop existing containers (if any)
      run: |
        docker compose down --remove-orphans || true

    - name: Run Docker Compose up
      run: |
        COMPOSE_FILES="-f docker-compose.yaml"
        if [ "${{ inputs.coverage }}" == "true" ]; then
          COMPOSE_FILES="$COMPOSE_FILES -f tests/coverage/docker-compose.coverage.yaml"
        fi
        if [ "${{ inputs.skip_docker_build }}" == "false" ]; then
          echo "Building and starting containers..."
          docker compose $COMPOSE_FILES up -d --build
        else
          echo "Starting existing containers..."
          docker compose $COMPOSE_FILES up -d
        fi

    - name: PHP logic tests (A4 password hashing)
      run: docker exec formulize-web-1 php /var/www/html/tests/password_hashing_test.php

    - name: PHP logic tests ({element_handle} reference binding)
      run: docker exec formulize-web-1 php /var/www/html/tests/reference_binding_test.php

    - name: PHP logic tests (T3.1' normalize-then-escape form sinks)
      run: docker exec formulize-web-1 php /var/www/html/tests/normalize_then_escape_test.php

    - name: PHP logic tests (EMPTYSET searches and search term prefixes)
      run: docker exec formulize-web-1 php /var/www/html/tests/empty_set_search_test.php

    - name: PHP logic tests (partial date searches)
      run: docker exec formulize-web-1 php /var/www/html/tests/date_search_test.php

    - name: PHP logic tests (partial date searches, as a site that shows dates as d/m/Y)
      run: docker exec formulize-web-1 php /var/www/html/tests/date_search_test.php --date-format=d/m/Y

    - name: PHP logic tests (the formats time elements show times in)
      run: docker exec formulize-web-1 php /var/www/html/tests/time_format_test.php

    - name: PHP logic tests (blocked file-extension lists in step)
      run: docker exec formulize-web-1 php /var/www/html/tests/blocked_extensions_sync_test.php

    - name: PHP logic tests (the text of Other options in element values)
      run: docker exec formulize-web-1 php /var/www/html/tests/other_text_values_test.php

    - name: Install dependencies
      run: npm ci
      working-directory: tests/e2e

    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps
      working-directory: tests/e2e

    - name: Run Playwright setup tests (sequential)
      run: |
        if [ "${{ inputs.coverage }}" == "true" ]; then
          echo "${{ inputs.test_filter && 'filtered' || '01-setup' }}" > "$FORMULIZE_COVERAGE_DIR/phase"
        fi
        if [ -n "${{ inputs.test_filter }}" ]; then
          echo "Running filtered tests: ${{ inputs.test_filter }}"
          npx playwright test ${{ inputs.test_filter }}
        else
          npx playwright test formulize-core/01-setup --workers=1
        fi
      working-directory: tests/e2e

    - name: Run Playwright validation tests (concurrent)
      if: ${{ !inputs.test_filter }}
      run: |
        if [ "${{ inputs.coverage }}" == "true" ]; then
          echo 02-validate > "$FORMULIZE_COVERAGE_DIR/phase"
        fi
        npx playwright test formulize-core/02-validate --workers=4 --fully-parallel
      working-directory: tests/e2e

    # After the validate specs, and on one worker: these change things the museum system shares - renaming the
    # elements its screens, views and notifications use - check the system still works, and put them back.
    - name: Run Playwright validation tests that change the system (sequential)
      if: ${{ !inputs.test_filter }}
      run: |
        if [ "${{ inputs.coverage }}" == "true" ]; then
          echo 03-validate-sequential > "$FORMULIZE_COVERAGE_DIR/phase"
        fi
        npx playwright test formulize-core/03-validate-sequential --workers=1
      working-directory: tests/e2e

    # After the validate specs, and on one worker: the appearance specs switch the whole site to Lyris while
    # they run, and put it back when they're done.
    - name: Run Playwright appearance tests (sequential)
      if: ${{ !inputs.test_filter }}
      run: |
        if [ "${{ inputs.coverage }}" == "true" ]; then
          echo 04-appearance > "$FORMULIZE_COVERAGE_DIR/phase"
        fi
        npx playwright test formulize-core/04-appearance --workers=1
      working-directory: tests/e2e

    # This one runs after the suite rather than before it, unlike the PHP tests above: it checks what
    # deleting an element would disturb across every screen, element, saved view and form on the system,
    # so it wants the finished museum system to look at. It builds its own fixtures for the kinds of
    # reference the museum system does not happen to contain, inside a transaction it rolls back, so the
    # dump taken in the next step is unaffected. Skipped alongside the validate suite when a filter is in
    # use, because a partly built system is not the system it is asking about.
    - name: PHP integrity tests (element reference scan, against the built system)
      if: ${{ !inputs.test_filter }}
      run: |
        if [ "${{ inputs.coverage }}" == "true" ]; then
          echo php-integrity > "$FORMULIZE_COVERAGE_DIR/phase"
        fi
        docker exec formulize-web-1 php /var/www/html/tests/element_reference_integrity_test.php

    # What a rename rewrites in a piece of code. It reads nothing of the system and writes nothing, but it needs the
    # application booted, which needs the install the setup specs do.
    - name: PHP integrity tests (what a rename rewrites in code)
      if: ${{ !inputs.test_filter }}
      run: docker exec formulize-web-1 php /var/www/html/tests/element_handle_code_test.php

    - name: PHP integrity tests (saved views round trip)
      if: ${{ !inputs.test_filter }}
      run: docker exec formulize-web-1 php /var/www/html/tests/saved_views_test.php

    - name: PHP integrity tests (menu item groups and the menu block)
      if: ${{ !inputs.test_filter }}
      run: docker exec formulize-web-1 php /var/www/html/tests/menu_permissions_test.php

    # Also after the suite rather than before it, but for a different reason than the two above: it needs
    # nothing the museum system contains, but it does need the application booted to build element
    # objects at all, and the install happens in the setup specs. It reads and writes no data - every
    # element is in memory, and the only files it touches are its own, which it removes again.
    - name: PHP integrity tests (element code files, setVar/getVar)
      if: ${{ !inputs.test_filter }}
      run: docker exec formulize-web-1 php /var/www/html/tests/element_code_files_test.php

    # Before the containers come down, since the report is made in the web container, with the PHP the tests ran on. Also
    # after a failure, for the tests that did run. The run has only the commit it tests, so the lines that changed come from
    # the commit where this branch left the base branch, which GitHub finds, and which is fetched on its own.
    - name: Build the coverage report
      if: ${{ always() && inputs.coverage }}
      env:
        COVERAGE_BASE: ${{ inputs.coverage_base || 'master' }}
      run: |
        git ls-files '*.php' > "$FORMULIZE_COVERAGE_DIR/tracked.txt"
        DIFF_OPTIONS=""
        HEAD_SHA=$(git rev-parse HEAD)
        BASE_TIP=$(git ls-remote origin "refs/heads/$COVERAGE_BASE" | cut -f1)
        if [ -n "$BASE_TIP" ] \
          && BASE_SHA=$(gh api "repos/${{ github.repository }}/compare/$BASE_TIP...$HEAD_SHA" --jq .merge_base_commit.sha) \
          && git fetch --no-tags --depth=1 origin "$BASE_SHA" \
          && git diff -U0 --no-color "$BASE_SHA" "$HEAD_SHA" -- '*.php' > "$FORMULIZE_COVERAGE_DIR/changed.diff"; then
          DIFF_OPTIONS="--diff=/var/www/coverage/changed.diff --base=$COVERAGE_BASE"
        else
          echo "::warning::Could not find where this branch left $COVERAGE_BASE, so the report has no list of changed lines"
        fi
        docker exec formulize-web-1 php -d auto_prepend_file= -d xdebug.mode=off -d memory_limit=-1 /var/www/html/tests/coverage/merge.php --data=/var/www/coverage --out=/var/www/coverage/report --tracked=/var/www/coverage/tracked.txt $DIFF_OPTIONS
        cat "$FORMULIZE_COVERAGE_DIR/report/summary.md" >> "$GITHUB_STEP_SUMMARY"
        if [ -f "$FORMULIZE_COVERAGE_DIR/report/changed-lines.md" ]; then
          echo "" >> "$GITHUB_STEP_SUMMARY"
          head -c 600000 "$FORMULIZE_COVERAGE_DIR/report/changed-lines.md" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Create database dump and collect files
      if: always()
      run: |
        # Create directory for the final state after tests
        mkdir -p tests/e2e/final-state/docker/mariadb/seed
        mkdir -p tests/e2e/final-state/trust
        mkdir -p tests/e2e/final-state/logs
        mkdir -p tests/e2e/final-state/modules/formulize/code
        mkdir -p tests/e2e/final-state/modules/formulize/templates/screens

        # Dump the database
        docker exec formulize-mariadb-1 mariadb-dump --user user --password=password --default-character-set=utf8mb4 --databases formulize > tests/e2e/final-state/docker/mariadb/seed/formulize.sql
        # Copy mainfile.php and install.lock
        cp mainfile.php tests/e2e/final-state/ || echo "mainfile.php not found"
        cp install.lock tests/e2e/final-state/ || echo "install.lock not found"

        # Copy trust folder contents
        if [ -d "trust" ]; then
          cp -r trust/* tests/e2e/final-state/trust/ || echo "trust folder empty or not accessible"
        fi

        # Copy logs folder contents
        if [ -d "logs" ]; then
          cp -r logs/* tests/e2e/final-state/logs/ || echo "logs folder empty or not accessible"
        fi

        # The web server's own output: Apache's access log, with every request it answered, and its error log. The
        # activity log doesn't record requests for formulize_deleteEntryLock.php, so this is where to see whether a release arrived
        docker logs formulize-web-1 > tests/e2e/final-state/logs/web-server.log 2>&1 || echo "web server log not available"

        # Copy code folder contents
        if [ -d "modules/formulize/code" ]; then
          cp -r modules/formulize/code/* tests/e2e/final-state/modules/formulize/code/ || echo "code folder empty or not accessible"
        fi

        # Copy templates/screens folder contents
        if [ -d "modules/formulize/templates/screens" ]; then
          cp -r modules/formulize/templates/screens/* tests/e2e/final-state/modules/formulize/templates/screens/ || echo "templates/screens folder empty or not accessible"
        fi

    - name: Clean up containers
      if: always()
      run: |
        docker compose down --remove-orphans

    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: tests/e2e/test-report/
        retention-days: 7

    - name: Upload Final State
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: final-state
        path: tests/e2e/final-state/
        retention-days: 7

    - name: Upload Coverage Report
      if: ${{ always() && inputs.coverage }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: ${{ env.FORMULIZE_COVERAGE_DIR }}/report/
        retention-days: 7
