# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  issues: read
  pull-requests: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.319.0
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically -- EXCEPT IT DOESNT KNOW WHERE GEMFILE IS!
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Try bundle install again
        run: bundle install --gemfile=/home/runner/work/formulize/formulize/docs/Gemfile
      - name: Fetch roadmap data from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="https://api.github.com/repos/jegelstaff/formulize"
          DATADIR="/home/runner/work/formulize/formulize/docs/_data"

          api_get() {
            curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$1"
          }

          # Milestone API numbers: 8.2=8, 8.3=12, 9.0=7, 9.1=10
          for MS_NUM in 8 12 7 10; do
            api_get "$BASE/milestones/$MS_NUM" > "/tmp/ms_${MS_NUM}.json"

            # GitHub's /issues endpoint returns both issues and PRs; save raw for both states
            api_get "$BASE/issues?labels=Marquee+Feature&milestone=${MS_NUM}&state=open&per_page=50" \
              > "/tmp/raw_open_${MS_NUM}.json"
            api_get "$BASE/issues?labels=Marquee+Feature&milestone=${MS_NUM}&state=closed&per_page=50" \
              > "/tmp/raw_done_${MS_NUM}.json"

            # Collect issue numbers (items without a pull_request field) across both states
            jq -s '
              (.[0] + .[1]) |
              [.[] | select(has("pull_request") | not) | .number]
            ' "/tmp/raw_open_${MS_NUM}.json" "/tmp/raw_done_${MS_NUM}.json" \
              > "/tmp/issue_nums_${MS_NUM}.json"

            # Build open/done arrays: keep issues and PRs not linked to a collected issue.
            # A PR is considered linked if its body references a collected issue number
            # via a closing keyword (closes/fixes/resolves #N).
            for STATE in open done; do
              jq --slurpfile issue_nums "/tmp/issue_nums_${MS_NUM}.json" '
                [.[] |
                  select(
                    (has("pull_request") | not) or
                    (
                      (.body // "") |
                      [scan("(?i)(?:closes?|fixes?|resolves?)\\s+#([0-9]+)") | .[0] | tonumber] |
                      (map(select(. as $ref | ($issue_nums[0] | index($ref)) != null)) | length == 0)
                    )
                  ) |
                  {number: .number, title: .title, body: .body, html_url: .html_url}
                ]
              ' "/tmp/raw_${STATE}_${MS_NUM}.json" > "/tmp/${STATE}_${MS_NUM}.json"
            done
          done

          jq -n \
            --slurpfile ms8   /tmp/ms_8.json   --slurpfile open8   /tmp/open_8.json   --slurpfile done8   /tmp/done_8.json \
            --slurpfile ms12  /tmp/ms_12.json  --slurpfile open12  /tmp/open_12.json  --slurpfile done12  /tmp/done_12.json \
            --slurpfile ms7   /tmp/ms_7.json   --slurpfile open7   /tmp/open_7.json   --slurpfile done7   /tmp/done_7.json \
            --slurpfile ms10  /tmp/ms_10.json  --slurpfile open10  /tmp/open_10.json  --slurpfile done10  /tmp/done_10.json \
            '[
              {key: "v82",  version: "8.2", milestone: $ms8[0],  open: $open8[0],  done: $done8[0]},
              {key: "v83",  version: "8.3", milestone: $ms12[0], open: $open12[0], done: $done12[0]},
              {key: "v90",  version: "9.0", milestone: $ms7[0],  open: $open7[0],  done: $done7[0]},
              {key: "v91",  version: "9.1", milestone: $ms10[0], open: $open10[0], done: $done10[0]}
            ]' > "$DATADIR/roadmap_issues.json"
      - name: Set file/directory permissions
        working-directory: /home/runner/work/formulize/formulize
        run: |
          chmod 777 trust uploads modules templates_c cache themes tokens logs modules/formulize/cache modules/formulize/code modules/formulize/export modules/formulize/language/english/mail_template modules/formulize/queue modules/formulize/temp modules/formulize/templates/screens modules/formulize/upload mainfile.php ~/work/formulize/formulize
      - name: Stop existing containers (if any)
        working-directory: /home/runner/work/formulize/formulize
        run: docker compose down --remove-orphans || true
      - name: Start Formulize (for dumping real MCP tool schemas)
        working-directory: /home/runner/work/formulize/formulize
        run: docker compose up -d --build
      # A fresh checkout's database has no schema at all until the installer runs -
      # the seed SQL under docker/mariadb/seed/ is developer-local only (gitignored,
      # multiple hundred-MB DB dumps), so CI's mariadb container boots genuinely
      # empty. Reuse the e2e suite's own install test (the same one
      # e2e-test-manual.yml relies on) to bring the site up to a normal installed,
      # open state before asking it for its tool schemas. If any of this fails, the
      # dump step below still falls back to the committed docs/_data/mcp_tools.json
      # rather than failing the whole docs deploy.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        continue-on-error: true
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install e2e test dependencies
        working-directory: /home/runner/work/formulize/formulize/tests/e2e
        continue-on-error: true
        run: npm ci
      - name: Install Playwright Browsers
        working-directory: /home/runner/work/formulize/formulize/tests/e2e
        continue-on-error: true
        run: npx playwright install chromium --with-deps
      - name: Install Formulize (Playwright)
        working-directory: /home/runner/work/formulize/formulize/tests/e2e
        continue-on-error: true
        run: npx playwright test formulize-core/setup/001-install-formulize.spec.js
      - name: Dump MCP tool schemas from PHP
        # Runs the real registerTools() code (see mcp/dump_tools_for_docs.php) so
        # tool docs reflect actual resolved schemas - including the create/update
        # element tools, which are built entirely at runtime and can't be read as
        # static text. Never lets a failure here fail the docs deploy: if the app
        # doesn't boot cleanly in CI for some unrelated reason, we fall back to
        # the already-committed docs/_data/mcp_tools.json (slightly stale tool
        # docs beat a broken deploy).
        working-directory: /home/runner/work/formulize/formulize
        run: |
          # A cold `--build` container can restart once shortly after coming
          # up (observed: formulize-web-1 created, then auto-restarted by its
          # `restart: unless-stopped` policy within ~11s, before this step's
          # first attempt got a chance to run against a stable process) - so
          # this retries a few times with a short delay rather than treating
          # one bad attempt as a hard failure.
          DUMP_OK=0
          for attempt in 1 2 3 4 5; do
            set +e
            docker exec formulize-web-1 php /var/www/html/mcp/dump_tools_for_docs.php > /tmp/mcp_tools.json 2>/tmp/mcp_tools_stderr.log
            DUMP_EXIT=$?
            set -e

            echo "Attempt $attempt: docker exec exit code $DUMP_EXIT, dump size $(wc -c < /tmp/mcp_tools.json) bytes"

            # jq empty accepts a completely empty file as trivially valid (no
            # JSON value to reject), so it can't be used alone to detect a
            # silently empty dump - jq -e on 'length > 0' fails correctly in
            # that case (no output to be truthy), as well as on a genuine but
            # empty `[]`.
            if [ "$DUMP_EXIT" -eq 0 ] && jq -e 'length > 0' /tmp/mcp_tools.json > /dev/null 2>&1; then
              DUMP_OK=1
              break
            fi

            echo "Attempt $attempt did not produce a usable dump, retrying in 5s..."
            sleep 5
          done

          if [ "$DUMP_OK" -eq 1 ]; then
            cp /tmp/mcp_tools.json docs/_data/mcp_tools.json
            echo "Dumped $(jq 'length' /tmp/mcp_tools.json) tools from the running app on attempt $attempt."
          else
            echo "::warning::Failed to dump MCP tool schemas from the running app after $attempt attempts (last exit $DUMP_EXIT) - keeping the committed docs/_data/mcp_tools.json (tool docs may be slightly stale)."
            echo "--- stderr from dump_tools_for_docs.php (last attempt) ---"
            cat /tmp/mcp_tools_stderr.log || true
            echo "--- container status ---"
            docker ps -a || true
          fi
      - name: Stop Formulize
        working-directory: /home/runner/work/formulize/formulize
        run: docker compose down --remove-orphans
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        working-directory: /home/runner/work/formulize/formulize/docs
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3
        with:
          path: /home/runner/work/formulize/formulize/docs/_site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
